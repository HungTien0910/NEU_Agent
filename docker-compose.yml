services:
  postgres:
    image: postgres:16
    container_name: neu_postgres
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: neu
      POSTGRES_USER: neu_user
      POSTGRES_PASSWORD: neu_pass
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neu_user -d neu"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.19
    container_name: neu_neo4j
    restart: unless-stopped
    ports:
      - "17474:7474"
      - "17473:7473"
      - "17687:7687"
    environment:
      NEO4J_AUTH: "neo4j/neo4j_pass"
    volumes:
      - ./data/neo4j:/data
      - ./data/neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j_pass 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7.4
    container_name: neu_redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: neu_backend
    restart: unless-stopped
    ports:
      - "1111:1111"
    environment:
      pg_dsn: postgresql+psycopg2://neu_user:neu_pass@postgres:5432/neu
      neo4j_uri: bolt://neo4j:7687
      neo4j_user: neo4j
      neo4j_password: neo4j_pass
      redis_url: redis://redis:6379/0
      openai_api_key: ${OPENAI_API_KEY:-}
      openai_model: ${OPENAI_MODEL:-gpt-4o}
      smtp_host: ${SMTP_HOST:-}
      smtp_port: ${SMTP_PORT:-587}
      smtp_user: ${SMTP_USER:-}
      smtp_password: ${SMTP_PASSWORD:-}
      smtp_from_email: ${SMTP_FROM_EMAIL:-}
      smtp_from_name: ${SMTP_FROM_NAME:-NEU Data Query System}
      smtp_use_tls: ${SMTP_USE_TLS:-true}
      smtp_use_ssl: ${SMTP_USE_SSL:-false}
      frontend_base_url: ${FRONTEND_BASE_URL:-http://localhost:3003}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: neu_frontend
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:1111}
    depends_on:
      backend:
        condition: service_started
