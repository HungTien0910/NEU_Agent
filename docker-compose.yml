services:
  postgres:
    image: postgres:16
    container_name: neu_postgres
    ports:
      - "55432:5432"
    environment:
      POSTGRES_DB: neu
      POSTGRES_USER: neu_user
      POSTGRES_PASSWORD: neu_pass
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neu_user -d neu"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.19
    container_name: neu_neo4j
    ports:
      - "17474:7474"  # HTTP
      - "17473:7473"  # HTTPS
      - "17687:7687"  # Bolt
    environment:
      NEO4J_AUTH: "neo4j/neo4j_pass"
    volumes:
      - ./data/neo4j:/data
      - ./data/neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j_pass 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7.4
    container_name: neu_redis
    ports:
      - "16379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
